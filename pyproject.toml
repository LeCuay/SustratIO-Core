[project]
name = "sustratio-core"
version = "0.0.1"
description = "SustratIO is a platform design to monitor soil quality."
readme = "README.md"
authors = [
    { name = "LeCuay", email = "suso.becerra98@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pyjwt>=2.13.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

# Manager
[tool.uv]
package = false

# Format and linting
[tool.ruff]
# Git standard of 80 characters
line-length = 79
src = [
    "src",
]
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
extend-select = [
    # https://docs.astral.sh/ruff/rules/#flake8-quotes-q
    "Q",
    # https://docs.astral.sh/ruff/rules/#isort-i
    "I",
    # https://docs.astral.sh/ruff/rules/#eradicate-era
    "ERA",
    # https://docs.astral.sh/ruff/rules/#fastapi-fast
    "FAST",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "domain",
    "application",
    "testing",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
application = ["application"]
domain = ["domain"]
testing = ["pytest", "unittest"]
